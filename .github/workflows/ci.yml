name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.5
      # The rule's test cases, the command's exit codes and --ignore, and
      # the formatting of the Nix files.
      - run: nix flake check --print-build-logs
      - run: nix fmt -- --check .

  actions-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Fails when actions.lock disagrees with the workflows or a locked commit
      # no longer verifies upstream. Keep the pin below in step with the README.
      - name: Verify actions.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
